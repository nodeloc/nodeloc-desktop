appId: com.nodeloc.desktop
productName: NodeLoc
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
protocols:
  - name: NodeLoc
    schemes:
      - nodeloc
win:
  executableName: NodeLoc
  icon: resources/icon.ico
npmRebuild: false
